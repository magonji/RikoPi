# RikoPi hardware configuration (equivalent to the [Comm] section of Riko v5.ini)
# The program never modifies this file. Scan settings and the t0 set from the interface
# are saved in state.json (in this same folder).

simulate = false          # true = no hardware (also: rikopi --sim)
data_dir = "~/OKEdata"    # default folder for data files

[stage]                   # Newport XPS
host = "192.168.0.254"    # XPSaddr
port = 5001
group = "Group1"          # Axis = Group1/-  in Riko v5.ini
positioner = "Group1.Pos" # check the name in the XPS web interface (System > Groups)
reversed = true           # the '/-' in Axis
passes = 1                # 2 for double pass ('/x2')
t0_mm = 0.0               # stage position (mm, as shown by the XPS) of time zero -> recalibrate
# min_mm = -120           # optional limits, stricter than the controller's
# max_mm = 120
# velocity = 50           # mm/s (optional, PositionerSGammaParametersSet)

[lockin]                  # SR810 over RS232
port = "COM3"             # Windows: COM3, COM4… (Device Manager)
                          # Linux: "/dev/ttyUSB0"   Mac: "/dev/tty.usbserial-XXXX"
baudrate = 9600           # must match the SR810 front panel (SETUP → RS232). 19200 is faster
rtscts = false            # hardware flow control; switch on if characters get lost
invert = false            # inverts the sign of X

[chopper]                        # SR810slowChop: slow the chopper down after measuring
slow_after_scan = true           # 10 min after a scan ends, set the SR810 reference to slow_Hz
delay_min = 10
slow_Hz = 120
restore_on_start = true          # when the next scan starts, go back to the previous frequency
spinup_s = 10                    # wait for the chopper to get back up to speed
